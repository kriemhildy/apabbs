[package]
name = "apabbs"
version = "1.7.4"
edition = "2024"
default-run = "apabbs"

[profile.release]
opt-level = "z" # Optimize for size

[[bin]]
name = "migrate"        # Migration binary
path = "src/migrate.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
sqlx = { version = "^0.9", features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls",
    "uuid",
] }
tokio = { version = "^1.54", features = ["full"] }
axum = { version = "^0.8", features = ["form", "ws", "macros", "multipart"] }
axum-extra = { version = "^0.12", features = ["cookie"] }
dotenv = "^0.15"
tower-http = { version = "^0.7", features = ["trace"] }
tracing = "^0.1"
tracing-subscriber = "^0.3"
minijinja = { version = "^3.1", features = ["urlencode", "speedups", "serde"] }
futures = "^0.3"
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
regex = "^1.13"
uuid = { version = "^1.29", features = [
    "v4",
    "fast-rng",
    "macro-diagnostics",
    "serde",
] }
sha256 = "^1.6"
xxhash-rust = { version = "^0.8", features = ["xxh3"] }
tokio-cron-scheduler = "^0.15"
url = "^2.5"
rand = "^0.10"
sentry = { version = "^0.49", features = [
    "tower-axum-matched-path",
], optional = true }
bytes = "^1.12"
tower = { version = "^0.5", optional = true }
time = { version = "^0.3", features = ["formatting"] }

[dev-dependencies]
ctor = "^1.0"
tower = { version = "^0.5", features = ["util"] }
http-body-util = "^0.1"
serde_urlencoded = "^0.7"
form-data-builder = "^1.0"
tokio-tungstenite = { version = "^0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = "^0.3"

[features]
default = ["sentry"]
sentry = ["dep:sentry", "dep:tower"]
